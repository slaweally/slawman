# yaml-language-server: $schema=../slw-content/system/vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    admin_prefix: '%env(ADMIN_PREFIX)%'
    upload_dir: '%env(resolve:UPLOAD_DIR)%'
    max_upload_size: '%env(int:MAX_UPLOAD_SIZE)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\SettingsService:
        arguments:
            $cache: '@App\Service\DynamicAppCache'

    App\Service\DynamicAppCache:
        arguments:
            $filesystemCache: '@cache.app'

    App\EventListener\VisitorTrackingListener:
        arguments:
            $adminPrefix: '%admin_prefix%'

    App\EventListener\TrackerVisitListener:
        arguments:
            $adminPrefix: '%admin_prefix%'

    App\EventListener\WafRequestListener:
        arguments:
            $adminPrefix: '%admin_prefix%'

    App\Service\SecurityAlertService:
        arguments:
            $cache: '@cache.app'

    App\EventListener\ScheduledContentSubscriber:
        arguments:
            $adminPrefix: '%admin_prefix%'
            $cache: '@cache.app'

    App\Controller\Front\ContactController:
        bind:
            $contactFormLimiter: '@limiter.contact_form'

    App\Controller\Front\CommentController:
        bind:
            $commentFormLimiter: '@limiter.comment_form'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
